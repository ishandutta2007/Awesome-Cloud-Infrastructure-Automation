<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Dynamic Animations */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }

    .pulse-bg { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .animated-line { stroke-dasharray: 8; animation: dash 2s linear infinite; }
    .floating-card-1 { animation: float1 4s ease-in-out infinite; }
    .floating-card-2 { animation: float2 5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGradient)" />

  <!-- Dynamic Background Ambient Glowing Orbs -->
  <circle cx="150" cy="80" r="120" fill="#0284c7" opacity="0.25" filter="url(#glow)" class="pulse-bg" />
  <circle cx="1050" cy="220" r="140" fill="#6366f1" opacity="0.2" filter="url(#glow)" class="pulse-bg" />

  <!-- Grid Pattern overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250" />
    <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300 M 500 0 L 500 300 M 600 0 L 600 300 M 700 0 L 700 300 M 800 0 L 800 300 M 900 0 L 900 300 M 1000 0 L 1000 300 M 1100 0 L 1100 300" />
  </g>

  <!-- Dynamic Animated Infrastructure Connectors (Background Layer) -->
  <g stroke="url(#accentGradient)" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 100 220 Q 250 260 400 220 T 700 250 T 1000 210" class="animated-line" />
    <path d="M 150 50 Q 400 10 600 60 T 1050 40" class="animated-line" />
  </g>

  <!-- Side Floating Flow Nodes / Cards -->
  <g class="floating-card-1" transform="translate(60, 110)">
    <rect width="160" height="70" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="32" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">☁ Multi-Cloud</text>
    <text x="20" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8">AWS • GCP • Azure</text>
  </g>

  <g class="floating-card-2" transform="translate(980, 110)">
    <rect width="160" height="70" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5" />
    <text x="20" y="32" font-family="sans-serif" font-size="12" fill="#c084fc" font-weight="bold">⚡ IaC &amp; GitOps</text>
    <text x="20" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8">OpenTofu • K8s</text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Pill -->
  <g transform="translate(470, 42)">
    <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="130" y="21" text-anchor="middle" class="badge-text">🚀 CURATED ECOSYSTEM</text>
  </g>

  <text x="600" y="125" text-anchor="middle" class="title">Awesome Cloud Infrastructure Automation</text>
  <rect x="450" y="142" width="300" height="4" rx="2" fill="url(#accentGradient)" />
  <text x="600" y="182" text-anchor="middle" class="subtitle">SaaS Platforms • Open-Source Tools • Multi-Cloud Provisioning • FinOps</text>

  <g transform="translate(360, 215)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="65" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">🛠️ Provisioning</text>

    <rect x="145" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="215" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">🔒 Policy-as-Code</text>

    <rect x="298" y="0" width="120" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="358" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">💰 FinOps</text>

    <rect x="428" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="493" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">🔄 GitOps</text>
  </g>
</svg>
